
[platformio]
default_envs = nodemcu

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:nodemcu]
build_src_filter =
    -<*>
    +<main.cpp>

lib_deps =
    bogde/HX711
    blynkkk/Blynk

[env:test_load_cell]
build_src_filter =
    -<*>
    +<test_load_cell/test_load_cell.cpp>

lib_deps =
    bogde/HX711

[env:reset_eeprom]
build_src_filter =
    -<*>
    +<reset_eeprom/reset_eeprom.cpp>
